<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELSEWHERE OS — A softer universe</title><style>
:root{font-family:Inter,"Segoe UI",sans-serif;color:#34415c}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#c7b8e8}button,input,select{font:inherit}button{cursor:pointer}#wall{position:fixed;inset:0;background:radial-gradient(ellipse at 72% 23%,#ffe6d7 0%,transparent 37%),radial-gradient(ellipse at 19% 74%,#a6e2df 0%,transparent 43%),linear-gradient(130deg,#a7a3e5,#e6b9d6 55%,#f5d3b2);transition:filter .8s}#wall:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 35% 36%,#ffffff65,transparent 35%);animation:breathe 12s ease-in-out infinite alternate}@keyframes breathe{to{transform:scale(1.2) translate(4%,-2%);opacity:.45}}.orb{position:absolute;border-radius:50%;filter:blur(1px);box-shadow:inset -20px -20px 60px #ffffff33,0 20px 100px #ffffff55;animation:float 14s ease-in-out infinite alternate;pointer-events:none}.orb.one{width:260px;height:260px;left:57%;top:20%;background:linear-gradient(130deg,#ffffff77,#f9c5db33)}.orb.two{width:95px;height:95px;left:23%;top:60%;background:#fff8;animation-delay:-5s}@keyframes float{to{transform:translate(30px,-55px) rotate(20deg)}}.top{position:absolute;top:16px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:center;color:#46516d;text-shadow:0 1px 12px #fff8;z-index:20;font-size:13px}.top b{letter-spacing:.28em}.desktop{position:absolute;top:90px;left:30px;display:grid;gap:24px;z-index:2}.shortcut{width:95px;border:0;background:transparent;color:#35445f;display:grid;justify-items:center;gap:8px;font-size:12px}.shortcut .glyph,.dockicon{display:grid;place-items:center;border:1px solid #ffffffaa;background:#ffffff66;box-shadow:0 10px 30px #65638a23;backdrop-filter:blur(22px);border-radius:20px;width:60px;height:60px;font-size:27px;transition:transform .2s}.shortcut:hover .glyph,.dockicon:hover{transform:translateY(-5px)}.dock{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 14px;border:1px solid #fff9;background:#ffffff65;backdrop-filter:blur(35px);border-radius:27px;box-shadow:0 20px 60px #65638a44;z-index:100;max-width:calc(100vw - 16px);overflow:auto}.dockicon{width:48px;height:48px;border:0;font-size:24px;flex-shrink:0}.window{position:absolute;min-width:280px;min-height:180px;width:min(600px,calc(100vw - 24px));height:420px;border:1px solid #ffffffb5;border-radius:23px;background:#f9f9ffb9;backdrop-filter:blur(40px) saturate(1.3);box-shadow:0 25px 100px #43477350;overflow:hidden;display:flex;flex-direction:column;resize:both;z-index:10}.window.max{inset:42px 12px 95px!important;width:auto!important;height:auto!important;resize:none}.titlebar{height:54px;display:flex;align-items:center;gap:9px;padding:0 17px;cursor:move;user-select:none;flex-shrink:0;border-bottom:1px solid #fff7}.titlebar strong{font-size:13px;margin-left:10px;flex:1}.dot{width:12px;height:12px;border:0;border-radius:50%;padding:0}.red{background:#ff8f9d}.yellow{background:#f4ce79}.green{background:#86d6b4}.body{padding:22px;overflow:auto;flex:1;font-size:14px}.body h2{margin:0 0 8px;font-weight:600;font-size:24px}.muted{color:#7b839c}.panel{background:#ffffff8a;border:1px solid #fff;border-radius:17px;padding:16px;margin:12px 0}.primary{border:0;border-radius:12px;background:#7976c8;color:white;padding:10px 15px}.soft{border:1px solid #ffffffbd;background:#ffffff80;border-radius:12px;padding:9px 12px;color:#485477;margin:4px}.terminal{background:#24283c;color:#b4f0d9;border-radius:13px;padding:15px;font-family:monospace;min-height:200px;white-space:pre-wrap}.terminal input{background:transparent;border:0;outline:0;color:#fff;width:75%}.art{width:100%;height:220px;border-radius:16px;display:block;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input[type=range]{width:100%}@media(max-width:600px){.desktop{top:75px;left:12px;gap:12px}.shortcut{width:75px}.shortcut .glyph{width:52px;height:52px}.window{left:8px!important;top:55px!important;width:calc(100vw - 16px)!important;height:calc(100dvh - 150px)!important;resize:none}.dock{bottom:10px}.top{left:12px;right:12px}}

/* V1.1 dreamscape art direction */
#wall{overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 78% 18%,#fff0e6 0%,transparent 43%),radial-gradient(ellipse at 9% 78%,#a5dfd7 0%,transparent 47%),linear-gradient(145deg,#9abbd8 0%,#d4c5eb 45%,#f6bfd7 80%,#efc7b6 100%)}
#wall:after{animation:breathe 20s ease-in-out infinite alternate;opacity:.55}
.horizon{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 54%,#f7f5ff16 72%,#ffffff20 100%);pointer-events:none}
.planet{position:absolute;left:53%;top:41%;width:min(36vw,360px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 29% 25%,#fffefaeb 0%,#fdf5ff8a 17%,#b9ddf175 43%,#a9a3e951 66%,#ffffff24 100%);box-shadow:inset -25px -35px 60px #727ac72b,inset 15px 15px 45px #ffffffbb,0 0 65px #ffffffa8,0 35px 110px #6f80ad3d;border:1px solid #ffffffa6;animation:planetFloat 11s ease-in-out infinite alternate;pointer-events:none}
.planet:before{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid #ffffff9c;transform:rotate(-24deg) scaleY(.5);box-shadow:0 0 35px #fff7}
.planet:after{content:"";position:absolute;left:12%;top:11%;width:38%;height:19%;border-radius:50%;background:#ffffff8c;filter:blur(18px);transform:rotate(-35deg)}
@keyframes planetFloat{to{transform:translate(-50%,calc(-50% - 20px)) rotate(8deg)}}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 2px),radial-gradient(circle,#fff9 1px,transparent 2px);background-size:139px 173px,211px 227px;background-position:13px 28px,70px 100px;opacity:.45;animation:starDrift 40s linear infinite alternate}
@keyframes starDrift{to{background-position:80px 90px,10px 180px}}
.top{border-radius:15px;padding:10px 13px;background:#ffffff18;backdrop-filter:blur(12px)}
.shortcut .glyph,.dockicon{border:1px solid #ffffffc9;background:linear-gradient(135deg,#ffffffad,#ffffff48);box-shadow:inset 0 1px #fff,0 12px 35px #596b9330}
.window{background:linear-gradient(135deg,#ffffffd6,#f9f5ffb8 55%,#fff1f5c6);box-shadow:0 25px 100px #444e8055,inset 0 1px #fff;animation:windowEnter .35s cubic-bezier(.18,.89,.32,1.2)}
@keyframes windowEnter{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.panel{box-shadow:inset 0 1px #fff,0 8px 22px #737ca012}
.dock{background:linear-gradient(125deg,#ffffff91,#ffffff5b);box-shadow:inset 0 1px #fff,0 20px 60px #65638a38}
@media(min-width:700px){.desktop{grid-template-columns:repeat(2,95px);gap:24px 16px}.planet{left:53%;top:48%}}
@media(max-width:699px){.desktop{grid-template-columns:repeat(3,minmax(0,1fr));left:12px;right:12px;top:82px;gap:20px 4px}.shortcut{width:100%;max-width:110px;justify-self:center}.shortcut .glyph{width:58px;height:58px}.planet{width:55vw;left:52%;top:62%;opacity:.9}.top{top:8px;left:8px;right:8px;font-size:11px}.top b{letter-spacing:.16em}.window{animation:windowEnter .3s ease-out}.dock{gap:6px;padding:8px}.dockicon{width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="wall"><div class="stars"></div><div class="horizon"></div><div class="planet"></div><div class="orb one"></div><div class="orb two"></div></div><header class="top"><b>✦ ELSEWHERE OS</b><span id="clock"></span></header><div id="desktop" class="desktop"></div><div id="windows"></div><nav id="dock" class="dock" aria-label="应用程序坞"></nav><script>
const apps=[["archive","◇","记忆档案馆"],["weather","☼","异星天气"],["terminal","⌘","量子终端"],["studio","✿","造物实验室"],["time","◷","时间机器"],["settings","⚙","系统设置"]];let topZ=20,virtualHour=Number(localStorage.getItem("elsewhere.hour")||12);const opened=new Map();const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function tick(){const d=new Date();$("#clock").textContent="UNIVERSE 07 · "+d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}tick();setInterval(tick,10000);
for(const [id,ico,name] of apps){const s=document.createElement("button");s.className="shortcut";s.innerHTML='<span class="glyph">'+ico+'</span><span>'+name+'</span>';s.onclick=()=>launch(id);$("#desktop").append(s);const b=document.createElement("button");b.className="dockicon";b.textContent=ico;b.title=name;b.onclick=()=>launch(id);$("#dock").append(b)}
function launch(id){if(opened.has(id)){const w=opened.get(id);w.style.display="flex";focus(w);return}const a=apps.find(x=>x[0]===id),w=document.createElement("section");w.className="window";w.setAttribute("role","dialog");w.setAttribute("aria-label",a[2]);w.style.left=Math.max(12,innerWidth/2-290+(opened.size%4)*22)+"px";w.style.top=Math.max(45,innerHeight/2-260+(opened.size%4)*22)+"px";w.innerHTML='<div class="titlebar"><button class="dot red" title="关闭"></button><button class="dot yellow" title="最小化"></button><button class="dot green" title="最大化"></button><strong>'+a[1]+' &nbsp; '+a[2]+'</strong><span>ELSEWHERE</span></div><div class="body"></div>';$("#windows").append(w);opened.set(id,w);focus(w);w.addEventListener("pointerdown",()=>focus(w));const dots=w.querySelectorAll(".dot");dots[0].onclick=()=>{w.remove();opened.delete(id)};dots[1].onclick=()=>w.style.display="none";dots[2].onclick=()=>w.classList.toggle("max");drag(w);render(id,w.querySelector(".body"))}
function focus(w){w.style.zIndex=++topZ}function drag(w){const h=w.querySelector(".titlebar");h.addEventListener("pointerdown",e=>{if(e.target.tagName==="BUTTON"||w.classList.contains("max"))return;const x=e.clientX-w.offsetLeft,y=e.clientY-w.offsetTop;h.setPointerCapture(e.pointerId);const move=p=>{w.style.left=Math.max(0,Math.min(innerWidth-80,p.clientX-x))+"px";w.style.top=Math.max(35,Math.min(innerHeight-90,p.clientY-y))+"px"};h.addEventListener("pointermove",move);h.addEventListener("pointerup",()=>h.removeEventListener("pointermove",move),{once:true})})}
function render(id,el){if(id==="archive"){el.innerHTML='<h2>记忆档案馆</h2><p class="muted">这里保存着从未发生，却依然被记住的事。</p><div id="records"></div>';const data=[["档案 001 · 没有日落的星期三","在宇宙 07，某个星期三的太阳忘记了落下。所有钟表都慢了七分钟。"],["档案 002 · 写给未来的信","收件人：尚未出生的自己。寄件日期：第零纪元。"],["档案 003 · 消失的海岸线","旧地图上有一条会随音乐移动的海岸线。"]];data.forEach(([t,c])=>{const b=document.createElement("button");b.className="panel";b.style.cssText="display:block;width:100%;text-align:left;color:inherit";b.innerHTML='<strong>'+t+'</strong><p class="muted">点击解封记忆</p>';b.onclick=()=>b.innerHTML='<strong>'+t+'</strong><p>'+c+'</p>';el.querySelector("#records").append(b)})}
if(id==="weather"){el.innerHTML='<h2>异星天气</h2><p class="muted">天气不仅属于地球。</p><div class="row" id="planets"></div><div class="panel" id="forecast"></div>';const ps=[["云母星","☁","18°","玻璃云缓缓穿过天空，预计持续三个黄昏。"],["珊瑚月","☀","32°","空气中漂浮着粉色微光，海洋正在发出低频歌声。"],["第七环","✧","−8°","冰晶雨，环带上方有双重极光。"]];ps.forEach(p=>{let b=document.createElement("button");b.className="soft";b.textContent=p[0];b.onclick=()=>$("#forecast").innerHTML='<div style="font-size:54px">'+p[1]+'</div><h2>'+p[2]+'</h2><strong>'+p[0]+'</strong><p>'+p[3]+'</p>';el.querySelector("#planets").append(b)});el.querySelector("#planets button").click()}
if(id==="terminal"){el.innerHTML='<h2>量子终端</h2><p class="muted">试试 help、whoami、date、echo、gravity、clear。</p><div class="terminal" id="output">ELSEWHERE Quantum Shell v1.0\nType help to begin.\n</div><form id="cmd"><span>❯ </span><input autocomplete="off" aria-label="终端命令"></form>';const o=el.querySelector("#output"),f=el.querySelector("#cmd");f.onsubmit=e=>{e.preventDefault();const input=f.querySelector("input"),v=input.value.trim();input.value="";const [cmd,...args]=v.split(/\s+/);const answers={help:"help | whoami | date | echo TEXT | gravity | clear",whoami:"A visitor from a universe not yet discovered.",date:"Universe 07 · Hour "+virtualHour+":00",gravity:"Gravity protocol is temporarily suspended."};o.textContent+="\n❯ "+v+"\n"+(cmd==="clear"?"":cmd==="echo"?args.join(" "):answers[cmd]||"Unknown command. Try help.");if(cmd==="clear")o.textContent="";o.scrollTop=o.scrollHeight}}
if(id==="studio"){el.innerHTML='<h2>造物实验室</h2><p class="muted">每一次生成都是独一无二的色彩标本。</p><canvas class="art" width="900" height="440"></canvas><div class="row"><button class="primary" id="generate">生成新宇宙</button><button class="soft" id="save">保存 PNG</button></div>';const c=el.querySelector("canvas"),ctx=c.getContext("2d");function paint(){const hue=Math.random()*360;const g=ctx.createLinearGradient(0,0,900,440);g.addColorStop(0,'hsl('+hue+' 75% 82%)');g.addColorStop(1,'hsl('+((hue+100)%360)+' 85% 82%)');ctx.fillStyle=g;ctx.fillRect(0,0,900,440);for(let i=0;i<75;i++){ctx.beginPath();ctx.arc(Math.random()*900,Math.random()*440,Math.random()*90+5,0,Math.PI*2);ctx.fillStyle='hsla('+((hue+i*7)%360)+' 90% 95% / '+(Math.random()*.5)+')';ctx.fill()}}paint();el.querySelector("#generate").onclick=paint;el.querySelector("#save").onclick=()=>{const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="elsewhere-art.png";a.click()}}
if(id==="time"){el.innerHTML='<h2>时间机器</h2><p class="muted">拨动时间，改变这个世界的光线。</p><div class="panel"><h2 id="hour"></h2><input id="range" type="range" min="0" max="23" value="'+virtualHour+'"><p>00:00 · 深夜　　12:00 · 正午　　23:00 · 夜幕</p></div>';const range=el.querySelector("#range");function set(){virtualHour=+range.value;el.querySelector("#hour").textContent=String(virtualHour).padStart(2,"0")+":00";localStorage.setItem("elsewhere.hour",virtualHour);$("#wall").style.filter=virtualHour<6||virtualHour>19?"brightness(.65) hue-rotate(28deg)":virtualHour>16?"sepia(.22)":"none"}range.oninput=set;set()}
if(id==="settings"){el.innerHTML='<h2>系统设置</h2><p class="muted">定制你在平行宇宙中的居所。</p><div class="panel"><strong>桌面色调</strong><div class="row" id="themes"></div></div><div class="panel">系统版本：ELSEWHERE OS 1.0<br>运行环境：Browser Universe<br>存储：本地浏览器</div>';for(const [name,hue] of [["梦境玻璃",0],["薄荷晨雾",85],["玫瑰黄昏",300]]){let b=document.createElement("button");b.className="soft";b.textContent=name;b.onclick=()=>{localStorage.setItem("elsewhere.hue",hue);$("#wall").style.filter="hue-rotate("+hue+"deg)"};el.querySelector("#themes").append(b)}}}
const saved=localStorage.getItem("elsewhere.hue");if(saved)$("#wall").style.filter="hue-rotate("+saved+"deg)";
setTimeout(()=>launch("archive"),550);
</script></body></html>
