x solid #fff9;background:#ffffff65;backdrop-filter:blur(35px);border-radius:27px;box-shadow:0 20px 60px #65638a44;z-index:100;max-width:calc(100vw - 16px);overflow:auto}.dockicon{width:48px;height:48px;border:0;font-size:24px;flex-shrink:0}.window{position:absolute;min-width:280px;min-height:180px;width:min(600px,calc(100vw - 24px));height:420px;border:1px solid #ffffffb5;border-radius:23px;background:#f9f9ffb9;backdrop-filter:blur(40px) saturate(1.3);box-shadow:0 25px 100px #43477350;overflow:hidden;display:flex;flex-direction:column;resize:both;z-index:10}.window.max{inset:42px 12px 95px!important;width:auto!important;height:auto!important;resize:none}.titlebar{height:54px;display:flex;align-items:center;gap:9px;padding:0 17px;cursor:move;user-select:none;flex-shrink:0;border-bottom:1px solid #fff7}.titlebar strong{font-size:13px;margin-left:10px;flex:1}.dot{width:12px;height:12px;border:0;border-radius:50%;padding:0}.red{background:#ff8f9d}.yellow{background:#f4ce79}.green{background:#86d6b4}.body{padding:22px;overflow:auto;flex:1;font-size:14px}.body h2{margin:0 0 8px;font-weight:600;font-size:24px}.muted{color:#7b839c}.panel{background:#ffffff8a;border:1px solid #fff;border-radius:17px;padding:16px;margin:12px 0}.primary{border:0;border-radius:12px;background:#7976c8;color:white;padding:10px 15px}.soft{border:1px solid #ffffffbd;background:#ffffff80;border-radius:12px;padding:9px 12px;color:#485477;margin:4px}.terminal{background:#24283c;color:#b4f0d9;border-radius:13px;padding:15px;font-family:monospace;min-height:200px;white-space:pre-wrap}.terminal input{background:transparent;border:0;outline:0;color:#fff;width:75%}.art{width:100%;height:220px;border-radius:16px;display:block;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input[type=range]{width:100%}@media(max-width:600px){.desktop{top:75px;left:12px;gap:12px}.shortcut{width:75px}.shortcut .glyph{width:52px;height:52px}.window{left:8px!important;top:55px!important;width:calc(1 /* V1.1 dreamscape art direction */
#wall{overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 78% 18%,#fff0e6 0%,transparent 43%),radial-gradient(ellipse at 9% 78%,#a5dfd7 0%,transparent 47%),linear-gradient(145deg,#9abbd8 0%,#d4c5eb 45%,#f6bfd7 80%,#efc7b6 100%)}
#wall:after{animation:breathe 20s ease-in-out infinite alternate;opacity:.55}
.horizon{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 54%,#f7f5ff16 72%,#ffffff20 100%);pointer-events:none}
.planet{position:absolute;left:53%;top:41%;width:min(36vw,360px);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 29% 25%,#fffefaeb 0%,#fdf5ff8a 17%,#b9ddf175 43%,#a9a3e951 66%,#ffffff24 100%);box-shadow:inset -25px -35px 60px #727ac72b,inset 15px 15px 45px #ffffffbb,0 0 65px #ffffffa8,0 35px 110px #6f80ad3d;border:1px solid #ffffffa6;animation:planetFloat 11s ease-in-out infinite alternate;pointer-events:none}
.planet:before{content:"";position:absolute;inset:12%;border-radius:50%;border:1px solid #ffffff9c;transform:rotate(-24deg) scaleY(.5);box-shadow:0 0 35px #fff7}
.planet:after{content:"";position:absolute;left:12%;top:11%;width:38%;height:19%;border-radius:50%;background:#ffffff8c;filter:blur(18px);transform:rotate(-35deg)}
@keyframes planetFloat{to{transform:translate(-50%,calc(-50% - 20px)) rotate(8deg)}}
.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#fff 1px,transparent 2px),radial-gradient(circle,#fff9 1px,transparent 2px);background-size:139px 173px,211px 227px;background-position:13px 28px,70px 100px;opacity:.45;animation:starDrift 40s linear infinite alternate}
@keyframes starDrift{to{background-position:80px 90px,10px 180px}}
.top{border-radius:15px;padding:10px 13px;background:#ffffff18;backdrop-filter:blur(12px)}
.shortcut .glyph,.dockicon{border:1px solid #ffffffc9;background:linear-gradient(135deg,#ffffffad,#ffffff48);box-shadow:inset 0 1px #fff,0 12px 35px #596b9330}
.window{background:linear-gradient(135deg,#ffffffd6,#f9f5ffb8 55%,#fff1f5c6);box-shadow:0 25px 100px #444e8055,inset 0 1px #fff;animation:windowEnter .35s cubic-bezier(.18,.89,.32,1.2)}

@media(max-width:600px){.world-scene{height:205px}.world-globe{width:150px;height:150px}.world-ring{width:195px}.terminal-shell .terminal{min-height:200px}}

@media(max-width:600px){.toast-stack{top:70px}.status-btn{padding:5px 7px}.top{gap:4px}.top b{font-size:11px}}
</style></head><body><div class="boot" id="boot"><div class="boot-inner"><span class="boot-symbol">✧</span><strong>ELSEWHERE OS</strong><small>INITIALIZING UNIVERSE 07</small></div></div><div class="toast-stack" id="toasts" aria-live="polite"></div><aside class="system-panel" id="systemPanel"><h3>✧ 宇宙通知中心</h3><div id="noticeList"><p>欢迎来到第七宇宙。</p></div><button class="soft" id="clearNotices">清空记录</button></aside><div id="wall"><div class="stars"></div><div class="horizon"></div><div class="planet"></div><div class="orb one"></div><div class="orb two"></div></div><header class="top"><b>✦ ELSEWHERE OS</b><div class="status-actions"><button class="status-btn" id="soundBtn" title="切换系统音效">♪</button><button class="status-btn" id="noticeBtn" title="通知中心">◉</button><span id="clock"></span></div></header><div id="desktop" class="desktop"></div><div id="windows"></div><nav id="dock" class="dock" aria-label="应用程序坞"></nav><script>
const apps=[["archive","◇","记忆档案馆"],["weather","☼","异星天气"],["terminal","⌘","量子终端"],["studio","✿","造物实验室"],["time","◷","时间机器"],["settings","⚙","系统设置"]];let topZ=20,virtualHour=Number(localStorage.getItem("elsewhere.hour")||12);const opened=new Map();const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function tick(){const d=new Date();$("#clock").textContent="UNIVERSE 07 · "+d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}tick();setInterval(tick,10000);
for(const [id,ico,name] of apps){const s=document.createElement("button");s.className="shortcut";s.innerHTML='<span class="glyph">'+ico+'</span><span>'+name+'</span>';s.onclick=()=>launch(id);$("#desktop").append(s);const b=document.createElement("button");b.className="dockicon";b.textContent=ico;b.title=name;b.onclick=()=>launch(id);$("#dock").append(b)}
function launch(id){if(opened.has(id)){const w=opened.get(id);w.style.display="flex";focus(w);return}const a=apps.find(x=>x[0]===id),w=document.createElement("section");w.className="window";w.setAttribute("role","dialog");w.setAttribute("aria-label",a[2]);w.style.left=Math.max(12,innerWidth/2-290+(opened.size%4)*22)+"px";w.style.top=Math.max(45,innerHeight/2-260+(opened.size%4)*22)+"px";w.innerHTML='<div class="titlebar"><button class="dot red" title="关闭"></button><button class="dot yellow" title="最小化"></button><button class="dot green" title="最大化"></button><strong>'+a[1]+' &nbsp; '+a[2]+'</strong><span>ELSEWHERE</span></div><div class="body"></div>';$("#windows").append(w);opened.set(id,w);focus(w);w.addEventListener("pointerdown",()=>focus(w));const dots=w.querySelectorAll(".dot");dots[0].onclick=()=>{w.remove();opened.delete(id)};dots[1].onclick=()=>w.style.display="none";dots[2].onclick=()=>w.classList.toggle("max");drag(w);render(id,w.querySelector(".body"));emit("app:open",{id})}
function focus(w){w.style.zIndex=++topZ}function drag(w){const h=w.querySelector(".titlebar");h.addEventListener("pointerdown",e=>{if(e.target.tagName==="BUTTON"||w.classList.contains("max"))return;const x=e.clientX-w.offsetLeft,y=e.clientY-w.offsetTop;h.setPointerCapture(e.pointerId);const move=p=>{w.style.left=Math.max(0,Math.min(innerWidth-80,p.clientX-x))+"px";w.style.top=Math.max(35,Math.min(innerHeight-90,p.clientY-y))+"px"};h.addEventListener("pointermove",move);h.addEventListener("pointerup",()=>h.removeEventListener("pointermove",move),{once:true})})}
function render(id,el){if(id==="archive"){el.innerHTML='<h2>记忆档案馆</h2><p class="muted">这里保存着从未发生，却依然被记住的事。</p><div id="records"></div>';const data=[["档案 001 · 没有日落的星期三","在宇宙 07，某个星期三的太阳忘记了落下。所有钟表都慢了七分钟。"],["档案 002 · 写给未来的信","收件人：尚未出生的自己。寄件日期：第零纪元。"],["档案 003 · 消失的海岸线","旧地图上有一条会随音乐移动的海岸线。"]];data.forEach(([t,c])=>{const b=document.createElement("button");b.className="panel";b.style.cssText="display:block;width:100%;text-align:left;color:inherit";b.innerHTML='<strong>'+t+'</strong><p class="muted">点击解封记忆</p>';b.onclick=()=>b.innerHTML='<strong>'+t+'</strong><p>'+c+'</p>';el.querySelector("#records").append(b)})}
if(id==="weather"){el.innerHTML='<h2>异星天气</h2><p class="muted">在三个不可能存在的世界之间旅行。</p><div class="row" id="planets"></div><div class="world-scene" id="worldScene"><div class="world-globe"></div><div class="world-ring"></div><div class="world-caption">LIVE FROM ANOTHER UNIVERSE</div></div><div class="panel" id="forecast"></div>';const ps=[["云母星","18°","玻璃云缓缓穿过天空，预计持续三个黄昏。","玻璃云层","微风 3.2","76%"],["珊瑚月","32°","粉色微光正在海面上空缓慢聚集。","珊瑚微光","暖流 1.8","43%"],["第七环","−8°","冰晶雨掠过环带，极光将在入夜后出现。","冰晶雨","环风 6.4","91%"]];ps.forEach((p,i)=>{const b=document.createElement("button");b.className="soft";b.textContent=p[0];b.onclick=()=>{const scene=el.querySelector("#worldScene");scene.dataset.world=i;emit("weather:changed",{index:i});el.querySelector("#forecast").innerHTML='<h2>'+p[1]+'</h2><strong>'+p[0]+'</strong><p>'+p[2]+'</p><div class="weather-stats"><div>天空<br><strong>'+p[3]+'</strong></div><div>风况<br><strong>'+p[4]+'</strong></div><div>大气湿度<br><strong>'+p[5]+'</strong></div><div>观测状态<br><strong>稳定</strong></div></div>';el.querySelectorAll("#planets button").forEach(x=>x.style.background="");b.style.background="#e6dfff"};el.querySelector("#planets").append(b)});const scene=el.querySelector("#worldScene");for(let i=0;i<20;i++){const dot=document.createElement("i");dot.className="spark";dot.style.left=(i*37%100)+"%";dot.style.top=(i*53%95)+"%";dot.style.animationDelay=(i%7*.3)+"s";scene.append(dot)}el.querySelector("#planets button").click()}
if(id==="terminal"){el.innerHTML='<h2>量子终端</h2><p class="muted">输入 help 查看命令，试试改变整个桌面。</p><div class="terminal-shell"><div class="terminal" id="output">ELSEWHERE Quantum Shell v1.2\nType help to begin.\n</div><form id="cmd"><span>❯</span><input autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="终端命令" placeholder="输入命令…"><button type="submit">运行 ↵</button></form></div><div class="row" id="quickcmd"></div>';const o=el.querySelector("#output"),f=el.querySelector("#cmd");const run=v=>{const [cmd,...args]=v.trim().split(/\s+/);if(!cmd)return;const answers={help:"help | whoami | date | echo TEXT | gravity | clear | bloom | night | day | portal",whoami:"A visitor from a universe not yet discovered.",date:"Universe 07 · Hour "+virtualHour+":00",gravity:"Gravity field: suspended. Objects are dreaming.",bloom:"The atmosphere is now glowing.",night:"Night protocol engaged.",day:"Daylight restored.",portal:"Portal coordinates: 07 / 42 / ∞"};if(cmd==="clear"){o.textContent="";return}o.textContent+="\n❯ "+v+"\n"+(cmd==="echo"?args.join(" "):answers[cmd]||"Unknown command. Try help.")+"\n";if(cmd==="bloom")document.querySelector("#wall").style.filter="saturate(1.7) brightness(1.1)";if(cmd==="night")document.querySelector("#wall").style.filter="brightness(.55) hue-rotate(35deg)";if(cmd==="day")document.querySelector("#wall").style.filter="none";if(cmd==="portal"){emit("terminal:portal");document.querySelector(".planet").animate([{transform:"translate(-50%,-50%) scale(1)"},{transform:"translate(-50%,-50%) scale(1.28) rotate(70deg)"},{transform:"translate(-50%,-50%) scale(1)"}],{duration:1300,easing:"ease-in-out"})}o.scrollTop=o.scrollHeight};f.onsubmit=e=>{e.preventDefault();const input=f.querySelector("input");run(input.value);input.value=""};["help","bloom","night","day","portal"].forEach(v=>{const b=document.createElement("button");b.className="soft";b.textContent=v;b.onclick=()=>run(v);el.querySelector("#quickcmd").append(b)})}
if(id==="studio"){el.innerHTML='<h2>造物实验室</h2><p class="muted">把数学规律变成可以收藏的宇宙艺术。</p><canvas class="art" width="1000" height="690"></canvas><div class="studio-controls"><select id="artmode" aria-label="生成模式"><option value="waves">流动丝绸</option><option value="orbit">星轨花园</option><option value="bloom">光之花</option></select><button class="primary" id="generate">重新生成</button><button class="soft" id="save">保存 PNG</button></div><p class="muted" id="artseed"></p>';const c=el.querySelector("canvas"),ctx=c.getContext("2d"),W=c.width,H=c.height;let seed=0;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}function paint(){seed=(Math.random()*4294967295)>>>0;const origin=seed,mode=el.querySelector("#artmode").value,hue=rand()*360;const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'hsl('+hue+' 75% 88%)');bg.addColorStop(.5,'hsl('+((hue+60)%360)+' 65% 83%)');bg.addColorStop(1,'hsl('+((hue+145)%360)+' 72% 78%)');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="screen";if(mode==="waves"){for(let k=0;k<85;k++){const offset=rand()*H,phase=rand()*6.28,amp=35+rand()*120;ctx.beginPath();for(let x=0;x<=W;x+=5){const y=offset+Math.sin(x/110+phase)*amp+Math.sin(x/53+phase*.7)*17;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.strokeStyle='hsla('+((hue+k*2)%360)+' 90% 92% / .26)';ctx.lineWidth=1+rand()*5;ctx.stroke()}}else if(mode==="orbit"){for(let k=0;k<110;k++){const x=W/2+(rand()-.5)*170,y=H/2+(rand()-.5)*100,rx=50+rand()*390,ry=12+rand()*170;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rand()*3.14,0,Math.PI*2);ctx.strokeStyle='hsla('+((hue+k*4)%360)+' 90% 95% / .3)';ctx.lineWidth=1+rand()*3;ctx.stroke()}}else{for(let j=0;j<13;j++){const cx=rand()*W,cy=rand()*H,petals=5+Math.floor(rand()*8),size=20+rand()*100;for(let k=0;k<petals;k++){ctx.beginPath();ctx.ellipse(cx+Math.cos(k*6.28/petals)*size*.6,cy+Math.sin(k*6.28/petals)*size*.6,size*.6,size*.25,k*6.28/petals,0,Math.PI*2);ctx.fillStyle='hsla('+((hue+j*25)%360)+' 90% 88% / .25)';ctx.fill()}}}ctx.globalCompositeOperation="source-over";for(let i=0;i<100;i++){ctx.beginPath();ctx.arc(rand()*W,rand()*H,rand()*2+.3,0,Math.PI*2);ctx.fillStyle="#ffffffb0";ctx.fill()}el.querySelector("#artseed").textContent="UNIVERSE SEED · "+origin.toString(16).toUpperCase().padStart(8,"0");emit("art:created",{seed:origin})}el.querySelector("#generate").onclick=paint;el.querySelector("#artmode").onchange=paint;el.querySelector("#save").onclick=()=>{const a=document.createElement("a");a.href=c.toDataURL("image/png");a.download="elsewhere-art-"+seed.toString(16)+".png";a.click()};paint()}
if(id==="time"){el.innerHTML='<h2>时间机器</h2><p class="muted">拨动时间，改变这个世界的光线。</p><div class="panel"><h2 id="hour"></h2><input id="range" type="range" min="0" max="23" value="'+virtualHour+'"><p>00:00 · 深夜　　12:00 · 正午　　23:00 · 夜幕</p></div>';const range=el.querySelector("#range");function set(){virtualHour=+range.value;el.querySelector("#hour").textContent=String(virtualHour).padStart(2,"0")+":00";localStorage.setItem("elsewhere.hour",virtualHour);emit("time:changed",{hour:virtualHour});$("#wall").style.filter=virtualHour<6||virtualHour>19?"brightness(.65) hue-rotate(28deg)":virtualHour>16?"sepia(.22)":"none"}range.oninput=set;set()}
if(id==="settings"){el.innerHTML='<h2>系统设置</h2><p class="muted">定制你在平行宇宙中的居所。</p><div class="panel"><strong>桌面色调</strong><div class="row" id="themes"></div></div><div class="panel">系统版本：ELSEWHERE OS 1.0<br>运行环境：Browser Universe<br>存储：本地浏览器</div>';for(const [name,hue] of [["梦境玻璃",0],["薄荷晨雾",85],["玫瑰黄昏",300]]){let b=document.createElement("button");b.className="soft";b.textContent=name;b.onclick=()=>{localStorage.setItem("elsewhere.hue",hue);$("#wall").style.filter="hue-rotate("+hue+"deg)"};el.querySelector("#themes").append(b)}}}

/* V1.3 system bus, sound, notifications and discoveries */
const bus=new EventTarget(),emit=(name,detail={})=>bus.dispatchEvent(new CustomEvent(name,{detail}));
let soundEnabled=localStorage.getItem("elsewhere.sound")==="true",audioCtx=null;
function chime(){if(!soundEnabled)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const t=audioCtx.currentTime;[523.25,783.99].forEach((hz,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type="sine";osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,t+i*.09);gain.gain.exponentialRampToValueAtTime(.045,t+i*.09+.025);gain.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.42);osc.connect(gain).connect(audioCtx.destination);osc.start(t+i*.09);osc.stop(t+i*.09+.44)})}catch(e){}}
const notices=[];function notify(title,message){notices.unshift({title,message});if(notices.length>20)notices.pop();const box=document.createElement("div");box.className="toast";const h=document.createElement("strong"),p=document.createElement("p");h.textContent=title;p.textContent=message;box.append(h,p);document.querySelector("#toasts").append(box);setTimeout(()=>box.remove(),4600);renderNotices();chime()}
function renderNotices(){const el=document.querySelector("#noticeList");el.replaceChildren();if(!notices.length){el.textContent="暂无通知";return}notices.forEach(n=>{const p=document.createElement("p");p.textContent=n.title+" · "+n.message;el.append(p)})}
document.querySelector("#noticeBtn").onclick=()=>document.querySelector("#systemPanel").classList.toggle("show");
document.querySelector("#clearNotices").onclick=()=>{notices.length=0;renderNotices()};
function updateSound(){document.querySelector("#soundBtn").textContent=soundEnabled?"♫":"♪";document.querySelector("#soundBtn").title=soundEnabled?"关闭音效":"开启音效"}
document.querySelector("#soundBtn").onclick=()=>{soundEnabled=!soundEnabled;localStorage.setItem("elsewhere.sound",soundEnabled);updateSound();notify("声音花园",soundEnabled?"系统音效已开启":"系统音效已关闭")};updateSound();
const discoveryKey="elsewhere.discoveries";let discoveries=[];try{discoveries=JSON.parse(localStorage.getItem(discoveryKey)||"[]")}catch(e){}
function discover(key,title){if(discoveries.includes(key))return;discoveries.push(key);localStorage.setItem(discoveryKey,JSON.stringify(discoveries));notify("✦ 发现隐藏记忆",title+" · 已收录 "+discoveries.length+"/4");emit("discovery",{key,title})}
bus.addEventListener("app:open",e=>{if(e.detail.id==="archive")notify("记忆档案馆","档案已解锁，等待你的探索。")});
bus.addEventListener("art:created",()=>{discover("creator","宇宙造物者")});
bus.addEventListener("weather:changed",e=>{if(e.detail.index===2)discover("ring","第七环的秘密")});
bus.addEventListener("terminal:portal",()=>{discover("portal","裂隙中的来信");notify("量子异常","第七宇宙的边界正在轻微波动。")});
bus.addEventListener("time:changed",e=>{if(e.detail.hour===0)discover("midnight","零点的访客")});
setTimeout(()=>{document.querySelector("#boot").classList.add("done");notify("ELSEWHERE OS","第七宇宙连接成功。欢迎回来。")},1200);

const saved=localStorage.getItem("elsewhere.hue");if(saved)$("#wall").style.filter="hue-rotate("+saved+"deg)";
setTimeout(()=>launch("archive"),550);
</script></body></html>
